# R1 Toolbox 镜像部署；首次默认仅诊断，完成后容器自行停止。
# 修改任务或 NEW_HTML 后，递增 TASK_REVISION 以便同次开机重新执行。
# 可通过 R1_TOOLBOX_IMAGE 指定版本；发布包固定为对应构建的 sha 镜像标签。
services:
  r1-toolbox:
    image: ${R1_TOOLBOX_IMAGE:-ghcr.io/shinku-chen/r1-toolbox:preview}
    container_name: r1-toolbox
    restart: always
    privileged: true
    pid: host
    ipc: host
    network_mode: host
    environment:
      TASK_CONTAINER: r1-toolbox
      TASK_REVISION: '1'
      NEW_HTML: ''
    volumes:
    - /:/host
    - /dev:/host/dev
    - /proc:/host/proc
    - /sys:/host/sys
    - /run:/host/run
