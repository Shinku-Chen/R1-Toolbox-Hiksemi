# R1 Toolbox 内置 UI：展开到 /run 内存目录并只读挂载，完成后容器自行停止。
# UI_MODE: image 使用镜像内置界面；diagnostic 仅诊断；directory 使用 UI_DIR。
# UI_DIR 仅 directory 模式填写 NAS 前端目录；原版小屏文件保持原样。
# 设置保存在独立 Docker 数据卷；UI 和服务仍从 /run 内存目录运行。
# 修改任务配置后递增 TASK_REVISION；更换镜像会自动重新执行。
# 可通过 R1_TOOLBOX_IMAGE 指定版本；发布包固定为对应构建的 sha 镜像标签。
services:
  r1-toolbox:
    image: ${R1_TOOLBOX_IMAGE:-ghcr.io/shinku-chen/r1-toolbox:preview}
    container_name: r1-toolbox
    restart: always
    privileged: true
    pid: host
    ipc: host
    network_mode: host
    environment:
      TASK_CONTAINER: r1-toolbox
      TASK_REVISION: '5'
      UI_MODE: image
      UI_DIR: ''
    volumes:
    - /:/host
    - /dev:/host/dev
    - /proc:/host/proc
    - /sys:/host/sys
    - /run:/host/run
    - r1-toolbox-data:/data
volumes:
  r1-toolbox-data: {}
