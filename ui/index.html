<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'self' http://127.0.0.1:18731; base-uri 'none'; form-action 'none'">
  <title>R1 Toolbox · 小屏</title>
  <link rel="stylesheet" href="./assets/panel.css">
  <script src="./assets/histor-bridge.js" defer></script>
  <script src="./assets/panel.js" defer></script>
</head>
<body>
  <main class="device-shell">
    <article class="device" id="device" aria-label="R1 Toolbox 小屏"></article>
    <div class="floating-status" id="power-status" role="status" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="modal-layer" id="modal" hidden></div>
    <button type="button" class="sleep-layer" id="sleep" data-action="wake" hidden aria-label="屏幕已息屏，轻触唤醒"></button>
  </main>
</body>
</html>
