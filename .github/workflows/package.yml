name: 检查与发布 Toolbox 镜像

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sync_preview_from:
        description: 将指定已发布标签同步为 preview（留空不执行）
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install development dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Check generated files
        run: |
          python scripts/build-api-contracts.py --check
          python tools/boot-once/build-compose.py
          git diff --exit-code -- composer.yml composer.dev.yml tools/boot-once/compose.yaml tools/boot-once/runner.sh
      - name: Check shell syntax
        run: |
          for script in tools/boot-once/*.sh tools/boot-once/*.sh.in docker/*.sh scripts/*.sh; do
            sh -n "$script"
          done
      - name: Build bundled UI and check JavaScript syntax
        run: |
          python scripts/build-panel.py
          git diff --exit-code -- ui/web/index.html ui/web/login.html
          python scripts/build-prototype.py --check
          python scripts/build-ui.py
          for script in ui/assets/*.js ui/panel-src/*.js; do node --check "$script"; done
      - name: Check the official hidden-window handshake
        run: node tests/check_histor_bridge.cjs
      - name: Check fan daemon signal readiness with owned Linux helpers
        run: python tests/check_fan_startup_linux.py
      - name: Check touch controls in an isolated browser with fixture APIs
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node tests/check_interactions.cjs
          node tests/check_web_config.cjs
          node tests/check_smart_refresh.cjs
          node tests/check_storage_refresh_entry.cjs
          node tests/check_small_screen_fill.cjs
          node tests/check_storage_fill_http.cjs
          node tests/check_network_curves.cjs
          node tests/check_temperature_curves.cjs
          node tests/check_api_management.cjs
          node tests/check_service_settings.cjs
          node tests/check_business_status.cjs
          node tests/check_media_sort_plugin.cjs
          node tests/check_small_screen_prototype.cjs
      - name: Check Python syntax
        run: python -m compileall -q scripts tools runtime tests
      - name: Check native fan adapter without NAS devices
        run: python tests/check_fan_guard_linux.py
      - name: Validate Compose configuration
        env:
          R1_DEV_ALLOW_IPS: '127.0.0.1'
        run: |
          docker compose -f composer.yml config --quiet
          docker compose -f composer.dev.yml config --quiet
          docker compose -f tools/boot-once/compose.yaml config --quiet
      - name: Check the simulated boot-once lifecycle
        run: python tools/boot-once/test_runner.py
      - name: Check image delivery contracts
        run: python -m unittest discover -s tests -v
      - name: Verify recoverable file mutations with real Linux root descriptors
        run: |
          sudo "$(command -v python)" -B -m unittest discover -s tests -p test_api_file_mutations.py -v
          sudo "$(command -v python)" -B -m unittest discover -s tests -p test_api_file_native_recycle.py -v
      - name: Verify admin-root boundaries with real Linux bind and overlay mounts
        run: |
          sudo "$(command -v python)" -B - <<'PY'
          import os
          import sys
          import unittest
          assert sys.platform == 'linux' and os.geteuid() == 0, 'real mount suite requires Linux UID 0'
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_admin_root_mount_boundary.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 4 or result.skipped or not result.wasSuccessful():
              raise SystemExit('real mount suite must execute all four cases without skips or failures')
          PY
      - name: Verify capacity cache with real Linux mounts and workers
        run: |
          sudo "$(command -v python)" -B - <<'PY'
          import os
          import sys
          import unittest
          assert sys.platform == 'linux' and os.geteuid() == 0, 'capacity mount suite requires Linux UID 0'
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_capacity_refresh_mount_linux.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 5 or result.skipped or not result.wasSuccessful():
              raise SystemExit('capacity mount suite must execute all five cases without skips or failures')
          PY
      - name: Verify real read-only service mount on the disposable runner
        run: sudo python3 tests/check_mount_linux.py

  publish-image:
    needs: checks
    # dev and v* tags refresh preview; only v* advances latest/version.
    # main pushes and pull requests never publish an image.
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) &&
      github.repository_owner == 'Shinku-Chen'
    runs-on: ubuntu-latest
    concurrency:
      group: r1-image-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install packaging dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Build, smoke-test, publish, and save linux/amd64 image
        env:
          PUBLISH_IMAGE: '1'
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/build-image.sh
      - uses: actions/upload-artifact@v7
        with:
          name: r1-toolbox-linux-amd64-${{ github.sha }}
          path: |
            dist/composer.yml
            dist/r1-toolbox-linux-amd64.tar
            dist/deployment-manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  sync-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.sync_preview_from != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Point preview at the requested image
        env:
          SOURCE_TAG: ${{ inputs.sync_preview_from }}
        run: |
          case "$SOURCE_TAG" in
            ''|*[!A-Za-z0-9_.-]*) echo '源标签无效' >&2; exit 1;;
          esac
          docker buildx imagetools create --tag ghcr.io/shinku-chen/r1-toolbox:preview "ghcr.io/shinku-chen/r1-toolbox:$SOURCE_TAG"

  pull-request-image:
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install packaging dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Build, smoke-test, and save image without registry access
        env:
          PUBLISH_IMAGE: '0'
        run: sh scripts/build-image.sh
      - uses: actions/upload-artifact@v7
        with:
          name: r1-toolbox-pr-linux-amd64-${{ github.sha }}
          path: |
            dist/composer.yml
            dist/r1-toolbox-linux-amd64.tar
            dist/deployment-manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
